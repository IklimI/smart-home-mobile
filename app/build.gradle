plugins { id 'com.android.application' }
android {
    namespace 'ru.iklim.smarthome'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.iklim.smarthome'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
        def haDefaultUrl = (project.findProperty('HA_DEFAULT_URL') ?: System.getenv('HA_DEFAULT_URL') ?: '').toString()
        buildConfigField 'String', 'HA_DEFAULT_URL', '"' + haDefaultUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
