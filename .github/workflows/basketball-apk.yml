name: Build Basketball Wi-Fi APK
on:
  push:
    branches: [basketball-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore standalone basketball project
        run: |
          mkdir -p basketball_build
          base64 -d basketball_source_base64.md | tar -xz -C basketball_build
      - name: Apply basketball physics v3 patch
        run: |
          base64 -d basketball_v3_patch_base64.md | gzip -dc > /tmp/basketball_v3.patch
          (cd basketball_build && patch --batch -p1 < /tmp/basketball_v3.patch)
          # Separate debug signing keys prevent in-place upgrades of v2; keep old app and its history intact.
          sed -i "s/applicationId 'ru.family.basketshooterproto'/applicationId 'ru.family.basketshooterproto.v3'/" basketball_build/app/build.gradle
          sed -i 's/Баскетбол: Папа и сын/Баскетбол Физика v3/' basketball_build/app/src/main/AndroidManifest.xml
          grep -n 'versionName' basketball_build/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p basketball_build :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: basketball-realistic-flight-v3-apk
          path: basketball_build/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
