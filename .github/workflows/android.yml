name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SmartHomeMobile-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmartHomeMobile-debug
          path: SmartHomeMobile-debug.apk
          if-no-files-found: error
          retention-days: 14
